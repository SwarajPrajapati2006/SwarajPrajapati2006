<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520" role="img" aria-label="Developer coding under a lamp">
  <defs>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e676" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .swing { transform-origin: 250px 0px; animation: swing 4s ease-in-out infinite; }
    @keyframes swing { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }

    .flicker { animation: flicker 3s steps(1) infinite; }
    @keyframes flicker { 0%,100% { opacity: 1; } 42% { opacity: .85; } 44% { opacity: 1; } 78% { opacity: .9; } 80% { opacity: 1; } }

    .armL { animation: type 0.5s ease-in-out infinite; }
    .armR { animation: type 0.5s ease-in-out infinite 0.25s; }
    @keyframes type { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }

    .head { transform-box: fill-box; transform-origin: center bottom; animation: nod 3s ease-in-out infinite; }
    @keyframes nod { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1.5deg); } }

    .plant { transform-origin: 438px 440px; animation: sway 5s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

    .steam { stroke-dasharray: 20; animation: steam 2.4s ease-in-out infinite; }
    .steam.s2 { animation-delay: 1.1s; }
    @keyframes steam { 0% { stroke-dashoffset: 20; opacity: 0; } 40% { opacity: .8; } 100% { stroke-dashoffset: -20; opacity: 0; } }

    .logo { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.5); opacity: .4; } }

    .sym { font-family: 'Fira Code', Consolas, monospace; font-size: 20px; font-weight: 700; fill: #00e676; opacity: 0; animation: rise 4.5s ease-out infinite; }
    .a2 { animation-delay: 0.9s; } .a3 { animation-delay: 1.8s; } .a4 { animation-delay: 2.7s; } .a5 { animation-delay: 3.6s; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-130px); opacity: 0; } }

    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes cursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .star { animation: twinkle 3s ease-in-out infinite; }
    .star.b { animation-delay: 1s; } .star.c { animation-delay: 2s; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  </style>

  <!-- background -->
  <rect width="500" height="520" rx="18" fill="#14171c"/>
  <circle class="star" cx="60" cy="60" r="2" fill="#fff"/>
  <circle class="star b" cx="440" cy="90" r="2" fill="#fff"/>
  <circle class="star c" cx="90" cy="180" r="1.5" fill="#fff"/>
  <circle class="star" cx="420" cy="200" r="1.5" fill="#fff"/>
  <circle class="star b" cx="350" cy="50" r="1.5" fill="#fff"/>

  <!-- lamp + light cone -->
  <g class="swing">
    <polygon class="flicker" points="238,158 262,158 380,440 120,440" fill="url(#cone)"/>
    <line x1="250" y1="0" x2="250" y2="112" stroke="#cfd3d8" stroke-width="3"/>
    <path d="M220 152 Q250 100 280 152 Z" fill="#e8453c"/>
    <ellipse class="flicker" cx="250" cy="154" rx="11" ry="6" fill="#ffd54a"/>
  </g>

  <!-- floor -->
  <line x1="70" y1="474" x2="430" y2="474" stroke="#2a2e35" stroke-width="3" stroke-linecap="round"/>

  <!-- legs -->
  <rect x="222" y="370" width="24" height="92" rx="8" fill="#e8453c"/>
  <rect x="254" y="370" width="24" height="92" rx="8" fill="#e8453c"/>
  <rect x="216" y="458" width="34" height="14" rx="6" fill="#f2f2f2"/>
  <rect x="250" y="458" width="34" height="14" rx="6" fill="#f2f2f2"/>

  <!-- body -->
  <rect x="218" y="296" width="64" height="84" rx="18" fill="#f2f2f2"/>

  <!-- head -->
  <g class="head">
    <circle cx="224" cy="272" r="6" fill="#f4c9a0"/>
    <circle cx="276" cy="272" r="6" fill="#f4c9a0"/>
    <circle cx="250" cy="268" r="28" fill="#f4c9a0"/>
    <path d="M221 266 Q219 232 250 232 Q281 232 279 266 Q268 248 250 250 Q232 248 221 266 Z" fill="#e8453c"/>
    <path d="M236 236 L232 218 L246 232 Z" fill="#e8453c"/>
    <path d="M250 232 L252 214 L262 234 Z" fill="#e8453c"/>
    <path d="M264 236 L274 222 L276 240 Z" fill="#e8453c"/>
    <circle class="eye" cx="240" cy="270" r="3.2" fill="#1b1b1b"/>
    <circle class="eye" cx="260" cy="270" r="3.2" fill="#1b1b1b"/>
    <path d="M243 282 Q250 288 257 282" stroke="#1b1b1b" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- desk -->
  <rect x="95" y="360" width="310" height="14" rx="4" fill="#26407a"/>
  <rect x="118" y="374" width="10" height="100" fill="#1d3262"/>
  <rect x="372" y="374" width="10" height="100" fill="#1d3262"/>

  <!-- laptop (back view) -->
  <rect x="198" y="354" width="104" height="8" rx="3" fill="#9aa0a8"/>
  <rect x="205" y="314" width="90" height="42" rx="5" fill="#2b2f36" stroke="#4a505a" stroke-width="2"/>
  <circle cx="250" cy="335" r="14" fill="url(#glow)"/>
  <circle class="logo" cx="250" cy="335" r="4.5" fill="#00e676"/>

  <!-- arms -->
  <g class="armL">
    <path d="M226 312 Q196 326 192 352" stroke="#f2f2f2" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="192" cy="354" r="8" fill="#f4c9a0"/>
  </g>
  <g class="armR">
    <path d="M274 312 Q304 326 308 352" stroke="#f2f2f2" stroke-width="14" fill="none" stroke-linecap="round"/>
    <circle cx="308" cy="354" r="8" fill="#f4c9a0"/>
  </g>

  <!-- mug + steam -->
  <rect x="338" y="334" width="26" height="26" rx="4" fill="#ff8a3d"/>
  <path d="M364 340 Q376 342 364 354" stroke="#ff8a3d" stroke-width="4" fill="none"/>
  <path class="steam" d="M346 328 Q340 316 348 306" stroke="#cfd3d8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path class="steam s2" d="M356 328 Q362 316 354 304" stroke="#cfd3d8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- plant -->
  <g class="plant">
    <path d="M438 440 L438 392" stroke="#2fa84f" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="418" cy="404" rx="22" ry="9" transform="rotate(-35 418 404)" fill="#2fa84f"/>
    <ellipse cx="458" cy="404" rx="22" ry="9" transform="rotate(35 458 404)" fill="#28903f"/>
    <ellipse cx="420" cy="428" rx="20" ry="8" transform="rotate(-20 420 428)" fill="#28903f"/>
    <ellipse cx="456" cy="428" rx="20" ry="8" transform="rotate(20 456 428)" fill="#2fa84f"/>
    <ellipse cx="438" cy="384" rx="9" ry="20" fill="#2fa84f"/>
  </g>
  <path d="M414 440 L462 440 L454 474 L422 474 Z" fill="#d9772f"/>

  <!-- floating code symbols -->
  <text class="sym" x="232" y="306">&lt;/&gt;</text>
  <text class="sym a2" x="262" y="306">{ }</text>
  <text class="sym a3" x="214" y="306">01</text>
  <text class="sym a4" x="272" y="306">=&gt;</text>
  <text class="sym a5" x="244" y="306">;</text>

  <!-- caption -->
  <text x="250" y="506" text-anchor="middle" font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="700" fill="#00e676">eat • sleep • code • repeat<tspan class="cursor">_</tspan></text>
</svg>
